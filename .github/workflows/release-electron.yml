# Publie les installateurs Windows (.exe) et macOS (.dmg) + métadonnées
# electron-updater en GitHub Release.
#
# Déclenchement : push d'un tag vX.Y.Z (ex. v0.1.1)
# Prérequis : la version dans package.json doit correspondre au tag
# (v0.1.1 → "version": "0.1.0" est rejeté ; utiliser 0.1.1).
#
# Le build macOS n'est PAS signé (pas de compte Apple Developer) :
# à la première ouverture, macOS affichera un avertissement "développeur
# non identifié". L'utilisateur doit faire un clic droit > Ouvrir sur
# l'app (une seule fois).

name: Release Electron

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') {
            Write-Error "Tag invalide: $tag (attendu vX.Y.Z)"
            exit 1
          }
          $expected = $tag.Substring(1)
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne $expected) {
            Write-Error "Version package.json ($($pkg.version)) != tag ($expected). Bumper package.json avant de tagger."
            exit 1
          }
          Write-Host "OK: version $($pkg.version) correspond au tag $tag"

      - name: Build & publish to GitHub Releases
        env:
          # Token fourni par Actions — permission contents:write ci-dessus
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Adresse du backend UniVol, INJECTÉE DANS L'INSTALLEUR au build.
          # Vite remplace cette valeur dans le code compilé : sans elle,
          # l'application installée resterait en mode hors ligne et
          # n'enverrait rien au serveur.
          # Le secret de dépôt est prioritaire ; à défaut, l'adresse par
          # défaut du serveur est utilisée (ce n'est pas une valeur secrète).
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://13.140.187.105' }}
          VITE_PIN_ADMIN: ${{ secrets.VITE_PIN_ADMIN }}
          VITE_PIN_COMMERCIAL: ${{ secrets.VITE_PIN_COMMERCIAL }}
          VITE_PIN_TECHNIQUE: ${{ secrets.VITE_PIN_TECHNIQUE }}
          VITE_PIN_OBSERVATEUR: ${{ secrets.VITE_PIN_OBSERVATEUR }}
        run: npm run electron:publish

  release-mac:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v ]]; then
            echo "Tag invalide: $tag (attendu vX.Y.Z)" >&2
            exit 1
          fi
          expected="${tag#v}"
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "$expected" ]; then
            echo "Version package.json ($actual) != tag ($expected). Bumper package.json avant de tagger." >&2
            exit 1
          fi
          echo "OK: version $actual correspond au tag $tag"

      - name: Build & publish to GitHub Releases (macOS, non signé)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Voir le commentaire du job Windows : sans cette variable,
          # l'application macOS installée serait aussi en mode hors ligne.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://13.140.187.105' }}
          VITE_PIN_ADMIN: ${{ secrets.VITE_PIN_ADMIN }}
          VITE_PIN_COMMERCIAL: ${{ secrets.VITE_PIN_COMMERCIAL }}
          VITE_PIN_TECHNIQUE: ${{ secrets.VITE_PIN_TECHNIQUE }}
          VITE_PIN_OBSERVATEUR: ${{ secrets.VITE_PIN_OBSERVATEUR }}
        run: npm run electron:publish:mac
